[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"

[prebuild.system_runners]
"x86_64-linux" = "ubuntu-24.04"

[ci]
runtime = "nix"
runner = "codefloe-global"
workspace = true
with_nextest = true
with_docs = true
provider = "crow"
platform = "forgejo"

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "db-harbor"
token_secret = "ATTIC_TOKEN"
